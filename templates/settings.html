{% extends "base.html" %}

{% block title %}阅读设置 - FastRead{% endblock %}

{% block content %}
<!-- 页面头部 -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-gear"></i> 设置</h2>
    <button class="btn btn-outline-secondary" onclick="history.length > 1 ? history.back() : location.href='/'">
        <i class="bi bi-x-lg"></i><span class="d-none d-md-inline"> 关闭</span>
    </button>
</div>

<!-- 阅读设置面板 -->
<div id="settingsPanel" class="">
    <h6>阅读设置</h6>
    <div class="row">
        <div class="col-md-6">
            <label class="form-label">字体大小</label>
            <input type="range" class="form-range" id="fontSizeSlider" min="12" max="24" value="16"
                onchange="changeFontSize(this.value)">
            <small class="text-muted">当前: <span id="fontSizeValue">16px</span></small>
        </div>
        <div class="col-md-6">
            <label class="form-label">行间距</label>
            <input type="range" class="form-range" id="lineHeightSlider" min="1.2" max="2.5" step="0.1"
                value="1.6" onchange="changeLineHeight(this.value)">
            <small class="text-muted">当前: <span id="lineHeightValue">1.6</span></small>
        </div>
        <div class="col-md-6">
            <label class="form-label">背景主题</label>
            <select class="form-select form-select-sm" id="themeSelect"
                onchange="changeTheme(this.value)">
                <option value="light">浅色</option>
                <option value="dark">深色</option>
                <option value="sepia">护眼米色</option>
                <option value="green">护眼绿色</option>
                <option value="blue">护眼蓝色</option>
                <option value="gray">护眼灰色</option>
                <option value="night">夜间模式</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">字体</label>
            <select class="form-select form-select-sm" id="fontSelect"
                onchange="changeFont(this.value)">
                <option value="system">系统默认</option>
                <option value="serif">宋体</option>
                <option value="sans-serif">黑体</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" id="autoScrollCheckbox"
                    onchange="toggleAutoScroll()">
                自动滚动</label>
            <input type="number" class="form-control form-control-sm" id="autoScrollSpeed"
                placeholder="滚动速度 (ms)" value="10" min="20"
                style="width: 70px; display: inline-block; margin-left: 10px;"
                onchange="updateAutoScrollSpeed()">
        </div>
    </div>
</div>

<hr>

<!-- AI配置 -->
<div id="aiSettingsPanel">
    <h6>AI配置</h6>
    <div class="row">
        <div class="col-md-6 mb-2">
            <label class="form-label">API地址</label>
            <input type="text" class="form-control form-control-sm" id="aiApiUrl"
                placeholder="https://api.openai.com/v1/chat/completions" onchange="saveAiConfig()">
        </div>
        <div class="col-md-6 mb-2">
            <label class="form-label">API密钥</label>
            <input type="password" class="form-control form-control-sm" id="aiApiKey"
                placeholder="sk-..." onchange="saveAiConfig()">
        </div>
        <div class="col-md-6 mb-2">
            <label class="form-label">模型</label>
            <input type="text" class="form-control form-control-sm" id="aiModel"
                placeholder="gpt-4o-mini" onchange="saveAiConfig()">
        </div>
        <div class="col-md-6 mb-2 d-flex align-items-center">
            <small class="text-muted">修改后自动保存。</small>
        </div>
    </div>
</div>

<hr>

<!-- 更新设置 -->
<div id="updateSettingsPanel">
    <h6>更新设置</h6>
    <div class="row align-items-center">
        <div class="col-md-6 mb-2">
            <div class="d-flex flex-wrap gap-3">
                <label class="form-check-label me-3" title="自动检查新版本并更新">
                    <input type="radio" name="s_upgrade" value="auto" class="form-check-input" onchange="saveUpdateConfig()"> 自动更新
                </label>
                <label class="form-check-label me-3" title="自动检查新版本提醒我更新">
                    <input type="radio" name="s_upgrade" value="manual" class="form-check-input" onchange="saveUpdateConfig()"> 提醒我
                </label>
                <label class="form-check-label" title="不自动检查">
                    <input type="radio" name="s_upgrade" value="off" class="form-check-input" onchange="saveUpdateConfig()"> 不检查
                </label>
            </div>
        </div>
        <div class="col-md-6 mb-2 d-flex align-items-center" id="s_check_row">
            <span id="s_check_now" class="me-2" style="cursor:pointer" onclick="checkUpdateNow()" title="立即检查更新">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </span>
            <span id="s_update_btn" class="me-2" style="display:none;cursor:pointer" onclick="goUpdate()" title="立即更新">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </span>
            <span id="s_check_result" style="font-size:12px;color:#999;">立即检查</span>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fontSize = localStorage.getItem('readerFontSize') || '16';
        const lineHeight = localStorage.getItem('readerLineHeight') || '1.6';
        const theme = localStorage.getItem('readerTheme') || 'light';
        const font = localStorage.getItem('readerFont') || 'system';

        document.getElementById('fontSizeSlider').value = fontSize;
        document.getElementById('lineHeightSlider').value = lineHeight;
        document.getElementById('themeSelect').value = theme;
        document.getElementById('fontSelect').value = font;
        if (typeof autoScrollEnabled !== 'undefined') {
            document.getElementById('autoScrollCheckbox').checked = autoScrollEnabled;
            document.getElementById('autoScrollSpeed').value = autoScrollSpeed;
        }
        loadAiConfig();
        loadUpdateConfig();
    })

    // 更新设置功能
    function toggleUpdateFields() {
        const mode = document.querySelector('input[name="s_upgrade"]:checked');
        const show = mode && mode.value !== 'auto';
        document.getElementById('s_check_row').style.visibility = show ? 'visible' : 'hidden';
        document.getElementById('s_check_now').style.display = show ? '' : 'none';
        document.getElementById('s_check_result').textContent = '立即检查';
        document.getElementById('s_update_btn').style.display = 'none';
    }

    async function loadUpdateConfig() {
        try {
            const response = await fetch('/api/update/config');
            const cfg = await response.json();
            const mode = cfg.upgrade === 'manual' ? 'manual' : (cfg.upgrade === 'off' ? 'off' : 'auto');
            const radio = document.querySelector(`input[name="s_upgrade"][value="${mode}"]`);
            if (radio) radio.checked = true;
            toggleUpdateFields();
        } catch (e) {
            console.error('加载更新配置失败:', e);
        }
    }

    async function saveUpdateConfig() {
        const mode = document.querySelector('input[name="s_upgrade"]:checked');
        toggleUpdateFields();
        if (!mode) return;
        try {
            const response = await fetch('/api/update/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ upgrade: mode.value })
            });
            const data = await response.json();
            showAlert(data.message || '保存失败', response.ok ? 'success' : 'danger');
        } catch (e) {
            showAlert('保存失败，请检查网络连接', 'danger');
        }
    }

    async function checkUpdateNow() {
        const resultEl = document.getElementById('s_check_result');
        resultEl.style.color = '#999';
        resultEl.textContent = '检查中...';
        document.getElementById('s_update_btn').style.display = 'none';
        try {
            const resp = await fetch('/api/update/check');
            const data = await resp.json();
            if (data.error) {
                resultEl.textContent = '检查失败';
                return;
            }
            if (data.has_update) {
                resultEl.textContent = '发现新版本 v' + data.latest;
                document.getElementById('s_check_now').style.display = 'none';
                document.getElementById('s_update_btn').style.display = '';
            } else {
                resultEl.textContent = '已是最新版本 (v' + data.current + ')';
            }
        } catch (e) {
            resultEl.textContent = '检查失败';
        }
    }

    // AI配置功能
    async function loadAiConfig() {
        try {
            const response = await fetch('/api/ai/config');
            const cfg = await response.json();
            document.getElementById('aiApiUrl').value = cfg.api_url || '';
            document.getElementById('aiApiKey').value = cfg.api_key || '';
            document.getElementById('aiModel').value = cfg.model || '';
        } catch (e) {
            console.error('加载AI配置失败:', e);
        }
    }

    async function saveAiConfig() {
        const payload = {
            api_url: document.getElementById('aiApiUrl').value.trim(),
            api_key: document.getElementById('aiApiKey').value.trim(),
            model: document.getElementById('aiModel').value.trim()
        };
        try {
            const response = await fetch('/api/ai/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            showAlert(data.message || '保存失败', response.ok ? 'success' : 'danger');
        } catch (e) {
            showAlert('保存失败，请检查网络连接', 'danger');
        }
    }

    // 阅读设置功能
    function changeFontSize(size) {
        document.getElementById('fontSizeValue').textContent = size + 'px';
        localStorage.setItem('readerFontSize', size);
    }

    function changeLineHeight(height) {
        document.getElementById('lineHeightValue').textContent = height;
        localStorage.setItem('readerLineHeight', height);
    }

    function changeTheme(theme) {
        localStorage.setItem('readerTheme', theme);
    }

    function changeFont(font) {
        localStorage.setItem('readerFont', font);
    }

</script>

{% endblock %}
